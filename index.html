<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادة المحقق الطبي</title>
<style>
:root{--bg:#e8f3f4;--card:#fff;--text:#16313a;--muted:#5b7580;--accent:#00897b;--ok:#2e7d32;--bad:#c62828;--warn:#fff0ef;--line:#d3e0e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--card:#1a2b30;--text:#e8f3f5;--muted:#9bb4bb;--accent:#4dd0c0;--ok:#5fd16a;--bad:#ff7a7a;--warn:#3a2222;--line:#33494f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c20;--card:#1a2b30;--text:#e8f3f5;--muted:#9bb4bb;--accent:#4dd0c0;--ok:#5fd16a;--bad:#ff7a7a;--warn:#3a2222;--line:#33494f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe9ee;color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;z-index:3}
.top button{background:none;border:0;font-size:18px;cursor:pointer;padding:0}
#bub{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 46px);background:var(--card);border-radius:16px;padding:10px 14px;z-index:3;max-height:36vh;overflow:auto;box-shadow:0 3px 12px rgba(0,0,0,.25);border:2px solid var(--accent)}
#bw{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}#bt{font-size:15px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px}.chip.ab{background:var(--warn);border-color:var(--bad);color:var(--bad);font-weight:700}
.opt{display:block;width:100%;font:inherit;font-size:14px;text-align:right;background:transparent;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.opt.no{border-color:var(--bad);opacity:.55}
.sm{font:inherit;font-size:12px;background:transparent;color:var(--muted);border:0;margin-top:6px;cursor:pointer;text-decoration:underline}
#pan{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3;max-height:44vh;overflow:auto;box-shadow:0 -3px 12px rgba(0,0,0,.2)}
.tg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.tb{font:inherit;font-size:10.5px;font-weight:700;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:6px 1px;cursor:pointer;line-height:1.4}
.tb span{font-size:20px;display:block}.tb:disabled{opacity:.4}
#tip{min-height:16px;font-size:12px;color:var(--bad);font-weight:700;text-align:center}
button.big{font:inherit;font-size:16px;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;width:100%}
.rc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;background:var(--bg)}
.rc>b{display:block;margin-bottom:4px;font-size:13px}
.rr{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px dashed var(--line);font-size:12.5px;align-items:center}
.rr small{color:var(--muted);font-size:11px;flex:1;text-align:left}.rr.ab{color:var(--bad)}.rr.ab b{font-weight:800}
.ov{position:fixed;inset:0;background:rgba(5,25,30,.84);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px;text-align:center;max-height:94vh;overflow:auto}
.box h2{margin:0 0 8px;color:var(--accent)}.box p{margin:6px 0;line-height:1.9;font-size:15px}.st{font-size:30px;margin:6px 0}
.box img{height:130px;display:block;margin:0 auto 4px}
#rl{text-align:right;font-size:13px;line-height:2;margin-top:6px}
.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><span id="cn"></span><span id="cr"></span><span id="hr"></span><button id="sn">🔊</button></div>
<div id="bub" class="hide"><div id="bw"></div><div id="bt"></div><div id="bo"></div></div>
<div id="pan" class="hide">
  <div class="chips" id="vt"></div>
  <div class="tg" id="tests"></div><div id="tip"></div>
  <button class="big" id="dx">🩺 شخّص الحالة</button>
  <div id="res"></div>
</div>
<div class="ov" id="start"><div class="box"><img id="di" alt=""><h2>🏥 عيادة المحقق الطبي</h2>
  <p>أنت الدكتور! يدخل المريض عيادتك ويحكي أعراضه. افحصه بـ <b>4 تحاليل فقط</b>، ثم يسألك بنفسه: «ما الذي أصابني؟».</p>
  <p>10 مرضى بأمراض متقاربة (سكر مرتفع ومنخفض، عدوى بكتيرية وفيروسية، قصور وفرط الغدة الدرقية...) فركّز في النتائج!</p>
  <button class="big" id="go">افتح العيادة</button></div></div>
<div class="ov hide" id="rs"><div class="box"><img id="ri" alt=""><h2 id="rt"></h2><div class="st" id="rst"></div><p id="rp"></p><div id="rl"></div><button class="big" id="nx"></button></div></div>

Bx(4,.5,1.3,0xb0bec5,0,.25,-2.1);Bx(4,.25,1.3,0x80deea,0,.62,-2.1);Bx(.9,.15,.8,0xffffff,-1.4,.82,-2.1);
Bx(1.6,2.6,.8,0xcfd8dc,-4,1.3,-2.6);Bx(.7,.18,.05,0xe53935,-4,2.1,-2.18);Bx(.18,.7,.05,0xe53935,-4,2.1,-2.17);
Bx(2.6,1.7,.06,0x90caf9,3.6,3.2,-3.08);Bx(.08,1.7,.07,0xffffff,3.6,3.2,-3.07);Bx(2.6,.08,.07,0xffffff,3.6,3.2,-3.07);
Bx(1.1,.7,.7,0x8d6e63,2.5,.35,-2.5);const pl=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),L(0x43a047));pl.position.set(2.5,1.15,-2.5);S.add(pl);
function emoTex(e){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);return new THREE.CanvasTexture(c);}
function icon(e,top){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex(e),depthTest:!top,transparent:true}));if(top)s.renderOrder=5;return s;}
[['🫀',-1.3],['🫁',0],['🧠',1.3]].forEach(a=>{const s=icon(a[0],0);s.position.set(a[1],3.6,-3);s.scale.set(1,1,1);S.add(s);});
function chr(key,h){const[u,asp]=IMG[key];const g=new THREE.Group();
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.TextureLoader().load(u),transparent:true}));sp.center.set(.5,0);sp.scale.set(h*asp,h,1);g.add(sp);g.sp=sp;g.h=h;
 const sh=new THREE.Mesh(new THREE.CircleGeometry(.5,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18}));sh.rotation.x=-Math.PI/2;sh.position.y=.01;sh.scale.set(h*asp*.8,h*asp*.28,1);g.add(sh);return g;}
const doc=chr('p5',2.7);doc.position.set(-1.5,0,.4);S.add(doc);
const tool=icon('🩺',1);tool.position.set(0,1.9,.8);tool.scale.set(1.1,1.1,1);tool.visible=false;S.add(tool);
/* game */
let ci,cr,hearts,stars,used,wrong,lock=true,state='x',tx=1.5,T=0,examT=0,joy=0,shake=0,pat,mood,K,ord,log;
const chip=(t,ab)=>`<span class="chip ${ab?'ab':''}">${t}</span>`;
function hud(){$('cn').textContent='الحالة '+(ci+1)+'/'+C.length;$('cr').textContent='🧪 '+cr;$('hr').textContent='❤️'.repeat(hearts)+'🖤'.repeat(4-hearts)+' ⭐'+stars;document.querySelectorAll('.tb').forEach(b=>b.disabled=!!used[b.dataset.t]);}
function say(w,h){$('bw').textContent=w;$('bt').innerHTML=h;$('bo').innerHTML='';$('bub').classList.remove('hide');}
function nextCase(){K=C[ord[ci]];if(pat)S.remove(pat);pat=chr(K.k,2.6*K.sc);pat.position.set(8,0,.4);S.add(pat);
 mood=icon(K.mo,1);mood.position.set(0,pat.h+.35,0);mood.scale.set(.75,.75,1);mood.visible=false;pat.add(mood);
 cr=4;used={};wrong=0;lock=true;tx=1.5;state='in';$('bub').classList.add('hide');$('pan').classList.add('hide');$('res').innerHTML='';$('tip').textContent='';
 const[t,p,r]=K.v;$('vt').innerHTML=chip('🌡️ '+t+'°م',t>37.8||t<35.5)+chip('💓 '+p+'/د',p>100||p<60)+chip('🫁 '+r+'/د',r>22||r<12);
 $('tests').innerHTML=Object.keys(TS).map(k=>`<button class="tb" data-t="${k}"><span>${TS[k][0]}</span>${TS[k][1]}</button>`).join('');hud();}
function arrived(){mood.visible=true;say('🗣️ '+K.n+'، '+K.a+' سنة:','«'+K.m+'»<div class="chips">'+K.sy.map(s=>chip(s)).join('')+'</div>');$('pan').classList.remove('hide');lock=false;beep(700,.12);}
$('tests').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b||lock)return;const k=b.dataset.t;if(used[k])return;if(cr<=0){$('tip').textContent='انتهت تحاليلك، شخّص الآن!';return;}
 used[k]=1;cr--;lock=true;examT=T+1.5;tool.material.map=emoTex(TS[k][0]);tool.material.needsUpdate=true;say('👨‍⚕️ الطبيب:','جارٍ إجراء «'+TS[k][1]+'»… '+TS[k][0]);hud();beep(500,.1);
 setTimeout(()=>{lock=false;const rows=K.r[k]||DEF[k];beep(800,.12);
  $('res').insertAdjacentHTML('afterbegin',`<div class="rc"><b>${TS[k][0]} ${TS[k][1]}</b>${rows.map(r=>`<div class="rr ${r[3]?'ab':''}"><span>${r[0]}</span><b>${r[1]} ${r[3]||''}</b><small>${r[2]}</small></div>`).join('')}</div>`);
  say('🗣️ '+K.n+':','«'+K.m+'»');},1500);});
$('dx').onclick=()=>{if(lock)return;$('pan').classList.add('hide');say('🗣️ '+K.n+':','«يا دكتور، ما الذي أصابني؟»');
 const ds=[K.dx,...C.filter(x=>x!==K).map(x=>x.dx).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 ds.forEach(d=>{const o=document.createElement('button');o.className='opt';o.textContent=d;o.onclick=()=>pick(o,d===K.dx);$('bo').appendChild(o);});
 const bk=document.createElement('button');bk.className='sm';bk.textContent='↩️ العودة للفحوصات';bk.onclick=()=>{say('🗣️ '+K.n+':','«'+K.m+'»');$('pan').classList.remove('hide');};$('bo').appendChild(bk);};
function pick(o,ok){
 if(!ok){o.classList.add('no');o.disabled=true;wrong++;hearts--;shake=T+.6;hud();beep(180,.3,'sawtooth');if(hearts<=0){setTimeout(()=>finish(false),700);}return;}
 lock=true;joy=T+.9;let s=cr>=2?3:cr===1?2:1;s=Math.max(1,s-wrong);stars+=s;log.push([K.dx,s]);hud();say('🗣️ '+K.n+':','«شكرًا يا دكتور! أحسنت 😊»');beep(660,.15);setTimeout(()=>beep(990,.25),150);
 setTimeout(()=>{$('ri').src=IMG[K.k][0];$('ri').classList.remove('hide');$('rl').innerHTML='';$('rt').textContent='✅ تشخيص صحيح: '+K.dx;$('rst').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);$('rp').textContent=K.x;$('nx').textContent=ci>=C.length-1?'النتيجة النهائية':'المريض التالي';
  $('nx').onclick=()=>{$('rs').classList.add('hide');$('bub').classList.add('hide');mood.visible=false;tx=8;state='out';};$('rs').classList.remove('hide');},900);}
function finish(w){lock=true;$('bub').classList.add('hide');$('pan').classList.add('hide');$('ri').src=IMG.p5[0];$('rt').textContent=w?'🏅 انتهى يومك في العيادة':'💔 فقدت ثقة المرضى';
 $('rst').textContent='⭐ '+stars+'/'+C.length*3;$('rp').textContent=(w?'':'راجع المعلومات وحاول مجددًا. ')+'التقييم: '+(stars>=26?'طبيب نابغ!':stars>=18?'طبيب ماهر':'طبيب متدرب');
 $('rl').innerHTML=log.map(l=>'• '+l[0]+' '+'⭐'.repeat(l[1])).join('<br>');$('nx').textContent='ابدأ من جديد';$('nx').onclick=startGame;$('rs').classList.remove('hide');}
function startGame(){ci=0;hearts=4;stars=0;log=[];ord=[...C.keys()].sort(()=>Math.random()-.5);$('rs').classList.add('hide');$('start').classList.add('hide');nextCase();}
$('go').onclick=startGame;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 const ex=T<examT;doc.sp.position.y=Math.sin(T*2)*.03;doc.position.x+=((ex?-1.15:-1.5)-doc.position.x)*Math.min(1,dt*8);tool.visible=ex;if(ex)tool.position.y=1.9+Math.sin(T*8)*.08;
 if(pat){const dx=tx-pat.position.x;
  if(Math.abs(dx)>.03){pat.position.x+=Math.sign(dx)*Math.min(Math.abs(dx),3*dt);pat.sp.position.y=Math.abs(Math.sin(T*10))*.1;pat.sp.material.rotation=Math.sin(T*10)*.05;}
  else{pat.sp.position.y=T<joy?Math.abs(Math.sin((joy-T)*8))*.4:Math.sin(T*2)*.03;pat.sp.material.rotation=T<shake?Math.sin(T*40)*.1:0;
   if(state==='in'){state='talk';arrived();}else if(state==='out'){state='x';if(ci>=C.length-1)finish(true);else{ci++;nextCase();}}}
  if(mood.visible)mood.position.y=pat.h+.35+Math.sin(T*3)*.08;}
 R.render(S,cam);}
requestAnimationFrame(loop);
</script>
