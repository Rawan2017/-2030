<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادة المحقق الطبي</title>
<style>
:root{--bg:#e8f3f4;--card:#fff;--text:#16313a;--muted:#5b7580;--accent:#00897b;--ok:#2e7d32;--bad:#c62828;--warn:#fff0ef;--line:#d3e0e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--card:#1a2b30;--text:#e8f3f5;--muted:#9bb4bb;--accent:#4dd0c0;--ok:#5fd16a;--bad:#ff7a7a;--warn:#3a2222;--line:#33494f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c20;--card:#1a2b30;--text:#e8f3f5;--muted:#9bb4bb;--accent:#4dd0c0;--ok:#5fd16a;--bad:#ff7a7a;--warn:#3a2222;--line:#33494f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe9ee;color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;z-index:3}
#bub{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 46px);background:var(--card);border-radius:16px;padding:10px 14px;z-index:3;max-height:36vh;overflow:auto;box-shadow:0 3px 12px rgba(0,0,0,.25);border:2px solid var(--accent)}
#bub:after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--accent);border-bottom:0}
#bw{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}#bt{font-size:15px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px}.chip.ab{background:var(--warn);border-color:var(--bad);color:var(--bad);font-weight:700}
.opt{display:block;width:100%;font:inherit;font-size:14px;text-align:right;background:transparent;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.opt.no{border-color:var(--bad);opacity:.55}
.sm{font:inherit;font-size:12px;background:transparent;color:var(--muted);border:0;margin-top:6px;cursor:pointer;text-decoration:underline}
#pan{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3;max-height:44vh;overflow:auto;box-shadow:0 -3px 12px rgba(0,0,0,.2)}
.tg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.tb{font:inherit;font-size:10.5px;font-weight:700;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:6px 1px;cursor:pointer;line-height:1.4}
.tb span{font-size:20px;display:block}.tb:disabled{opacity:.4}
#tip{min-height:16px;font-size:12px;color:var(--bad);font-weight:700;text-align:center}
button.big{font:inherit;font-size:16px;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;width:100%}
.rc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;background:var(--bg)}
.rc>b{display:block;margin-bottom:4px;font-size:13px}
.rr{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px dashed var(--line);font-size:12.5px;align-items:center}
.rr small{color:var(--muted);font-size:11px;flex:1;text-align:left}.rr.ab{color:var(--bad)}.rr.ab b{font-weight:800}
.ov{position:fixed;inset:0;background:rgba(5,25,30,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px;text-align:center}
.box h2{margin:0 0 8px;color:var(--accent)}.box p{margin:6px 0;line-height:1.9;font-size:15px}.st{font-size:30px;margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><span id="cn"></span><span id="cr"></span><span id="hr"></span></div>
<div id="bub" class="hide"><div id="bw"></div><div id="bt"></div><div id="bo"></div></div>
<div id="pan" class="hide">
  <div class="chips" id="vt"></div>
  <div class="tg" id="tests"></div><div id="tip"></div>
  <button class="big" id="dx">🩺 شخّص الحالة</button>
  <div id="res"></div>
</div>
<div class="ov" id="start"><div class="box"><h2>🏥 عيادة المحقق الطبي</h2>
  <p>أنت الدكتور! يدخل المريض عيادتك ويحكي لك أعراضه. افحصه بـ <b>4 تحاليل فقط</b>، ثم يسألك المريض بنفسه: «ما الذي أصابني؟».</p>
  <p>تحاليل أقل = نجوم أكثر، والتشخيص الخاطئ يخصم قلبًا من 3.</p>
  <button class="big" id="go">افتح العيادة</button></div></div>
<div class="ov hide" id="rs"><div class="box"><h2 id="rt"></h2><div class="st" id="rst"></div><p id="rp"></p><button class="big" id="nx"></button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const TS={cbc:['🩸','صورة الدم'],glu:['🍬','سكر الدم'],uri:['🧪','البول'],thy:['🦋','الدرقية'],crp:['🔥','الالتهاب'],sp:['🫁','التنفس']};
const DEF={cbc:[['كريات بيضاء','7.0','4–11 ألف'],['هيموغلوبين','14','12–16 غ/دل'],['كريات حمراء','5.0','4.5–5.5 مليون'],['حجم الكرية MCV','88','80–100']],glu:[['سكر صائم','90','70–100 ملغ/دل']],uri:[['سكر','سلبي','سلبي'],['كريات بيضاء','سلبي','سلبي'],['كيتونات','سلبي','سلبي']],thy:[['TSH','2.0','0.4–4'],['T4 الحر','1.2','0.8–1.8']],crp:[['CRP','2','أقل من 5 ملغ/ل']],sp:[['FEV1/FVC','82%','أكثر من 75%'],['تشبع الأكسجين','98%','95–100%']]};
const C=[
{dx:'السكري',n:'خالد',a:15,m:'أشرب ماءً كثيرًا ولا أرتوي',sy:['عطش شديد','كثرة التبول','نقص الوزن','تعب'],v:[36.8,92,20],r:{glu:[['سكر صائم','310 ملغ/دل','70–100','↑']],uri:[['سكر','+++','سلبي','↑'],['كريات بيضاء','سلبي','سلبي'],['كيتونات','+','سلبي','↑']]},x:'نقص الإنسولين يمنع دخول الجلوكوز إلى الخلايا فيرتفع في الدم ويخرج في البول ويسحب الماء معه، فيحدث العطش وكثرة التبول.'},
{dx:'فقر الدم (نقص الحديد)',n:'نورة',a:17,m:'أتعب بسرعة وأشعر بدوخة',sy:['شحوب','دوخة','ضيق نفس عند الجهد','تساقط الشعر'],v:[36.7,108,22],r:{cbc:[['كريات بيضاء','6.8','4–11 ألف'],['هيموغلوبين','7.8','12–16 غ/دل','↓'],['كريات حمراء','3.4','4.5–5.5 مليون','↓'],['حجم الكرية MCV','68','80–100','↓']]},x:'نقص الحديد يقلل بناء الهيموغلوبين، فتقل قدرة الدم على نقل الأكسجين وتصغر الكريات الحمراء، ويسرع القلب ليعوّض.'},
{dx:'عدوى بكتيرية',n:'سعود',a:20,m:'حلقي يؤلمني جدًا وأحس بحرارة',sy:['حمى مرتفعة','ألم عند البلع','تضخم الغدد','قشعريرة'],v:[39.2,110,22],r:{cbc:[['كريات بيضاء','17.5','4–11 ألف','↑'],['هيموغلوبين','14','12–16 غ/دل'],['كريات حمراء','5.0','4.5–5.5 مليون'],['حجم الكرية MCV','88','80–100']],crp:[['CRP','85','أقل من 5 ملغ/ل','↑']]},x:'ارتفاع الكريات البيضاء وCRP مع الحمى يدل على استجابة مناعية لعدوى بكتيرية، ويُعالج غالبًا بمضاد حيوي بعد تأكيد الطبيب.'},
{dx:'فرط نشاط الغدة الدرقية',n:'ريم',a:28,m:'قلبي يخفق بسرعة وأنا مرهقة',sy:['نقص الوزن مع شهية','تعرق','رجفة اليدين','عصبية'],v:[37.4,122,20],r:{thy:[['TSH','0.03','0.4–4','↓'],['T4 الحر','3.4','0.8–1.8','↑']]},x:'زيادة الثيروكسين ترفع معدل الأيض فيسرع القلب ويقل الوزن، وينخفض TSH بالتغذية الراجعة السالبة.'},
{dx:'الربو',n:'ياسر',a:12,m:'أسعل ليلًا ويصدر صدري صفيرًا',sy:['صفير عند الزفير','سعال ليلي','ضيق نفس بعد الجري','حساسية الغبار'],v:[36.9,102,27],r:{sp:[['FEV1/FVC','58%','أكثر من 75%','↓'],['تشبع الأكسجين','92%','95–100%','↓']]},x:'في الربو تضيق القصبات الهوائية وتلتهب، فيقل تدفق الهواء وتنخفض نسبة FEV1/FVC ويقل تشبع الأكسجين.'}];
const PA=[{sk:0xe0ac69,cl:0xf5efe0,sc:.88,mo:'😩'},{sk:0xe8b98a,cl:0x212121,f:1,hj:0x8e24aa,sc:.92,mo:'😵'},{sk:0xd9a066,cl:0xf5efe0,sc:1,mo:'🤒'},{sk:0xe8b98a,cl:0x212121,f:1,hj:0x00796b,sc:.98,mo:'😰'},{sk:0xd9a066,cl:0xf5efe0,sc:.8,mo:'😮'}];
/* 3D */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0xcfe9ee);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);
S.add(new THREE.AmbientLight(0xffffff,.85));const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(4,8,8);S.add(dl);
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const t=Math.tan(22.5*Math.PI/180),d=Math.max(7,2.7/(t*cam.aspect)),H=2*t*d;cam.position.set(0,2.4,d);cam.lookAt(0,1.1-.1*H,.3);cam.updateProjectionMatrix();}
addEventListener('resize',rs);rs();
const L=c=>new THREE.MeshLambertMaterial({color:c});
const Bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),L(c));m.position.set(x,y,z);S.add(m);return m;};
Bx(40,.2,16,0xd7ecef,0,-.1,2);Bx(40,8,.2,0xeaf6f6,0,4,-3.2);
Bx(4,.5,1.3,0xb0bec5,0,.25,-2.1);Bx(4,.25,1.3,0x80deea,0,.62,-2.1);Bx(.9,.15,.8,0xffffff,-1.4,.82,-2.1);
Bx(1.6,2.6,.8,0xcfd8dc,-4,1.3,-2.6);Bx(.7,.18,.05,0xe53935,-4,2.1,-2.18);Bx(.18,.7,.05,0xe53935,-4,2.1,-2.17);
Bx(2.6,1.7,.06,0x90caf9,3.6,3.2,-3.08);Bx(.08,1.7,.07,0xffffff,3.6,3.2,-3.07);Bx(2.6,.08,.07,0xffffff,3.6,3.2,-3.07);
Bx(1.1,.7,.7,0x8d6e63,2.5,.35,-2.5);const pl=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),L(0x43a047));pl.position.set(2.5,1.15,-2.5);S.add(pl);
function mk(o){const g=new THREE.Group(),a=new THREE.Group();g.add(a);
 const add=(geo,c,x,y,z,p=a)=>{const m=new THREE.Mesh(geo,L(c));m.position.set(x,y,z);p.add(m);return m;};
 if(o.doc){add(new THREE.CylinderGeometry(.34,.4,1.2,16),0xffffff,0,1.1,0);[-.15,.15].forEach(x=>add(new THREE.CylinderGeometry(.11,.11,.55,10),0x37474f,x,.28,0));add(new THREE.TorusGeometry(.2,.03,8,16),0x37474f,0,1.62,.02).rotation.x=Math.PI/2;}
 else add(new THREE.CylinderGeometry(.32,.5,1.65,18),o.cl,0,.92,0);
 add(new THREE.SphereGeometry(.27,16,12),o.sk,0,1.95,0);
 [-.09,.09].forEach(x=>add(new THREE.SphereGeometry(.035,6,6),0x111111,x,1.98,.25));
 if(o.doc)add(new THREE.SphereGeometry(.29,12,8,0,Math.PI*2,0,Math.PI/2),0x2b1b10,0,2,-.02);
 else if(o.f){add(new THREE.SphereGeometry(.31,14,10,0,Math.PI*2,0,Math.PI/1.7),o.hj,0,1.98,-.04);add(new THREE.CylinderGeometry(.3,.38,.45,14),o.hj,0,1.52,-.04);}
 else{add(new THREE.SphereGeometry(.3,14,10,0,Math.PI*2,0,Math.PI/2),0xffffff,0,2,-.02);add(new THREE.TorusGeometry(.28,.03,6,16),0x111111,0,2.04,-.02).rotation.x=Math.PI/2;}
 const arm=x=>{const p=new THREE.Group();p.position.set(x,1.62,0);a.add(p);add(new THREE.CylinderGeometry(.07,.07,.7,8),o.doc?0xffffff:o.cl,0,-.35,0,p);add(new THREE.SphereGeometry(.08,8,6),o.sk,0,-.72,0,p);return p;};
 g.armL=arm(-.4);arm(.4);g.a=a;g.scale.setScalar(o.sc||1);return g;}
function emoTex(e){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);return new THREE.CanvasTexture(c);}
function icon(e){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex(e),depthTest:false}));s.renderOrder=5;return s;}
const doc=mk({doc:1,sk:0xf1c27d});doc.position.set(-1.3,0,.3);doc.rotation.y=1;S.add(doc);
const tool=icon('🩺');tool.position.set(0,1.7,.8);tool.scale.set(1.1,1.1,1);tool.visible=false;S.add(tool);
/* game */
let ci,cr,hearts,stars,used,wrong,lock=true,state='x',tx=1.3,T=0,examT=0,joy=0,shake=0,pat,mood,cur=0;
const chip=(t,ab)=>`<span class="chip ${ab?'ab':''}">${t}</span>`;
function hud(){$('cn').textContent='الحالة '+(ci+1)+'/'+C.length;$('cr').textContent='🧪 '+cr+' تحاليل';$('hr').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts)+' ⭐'+stars;document.querySelectorAll('.tb').forEach(b=>b.disabled=!!used[b.dataset.t]);}
function say(w,h){$('bw').textContent=w;$('bt').innerHTML=h;$('bo').innerHTML='';$('bub').classList.remove('hide');}
function nextCase(){const c=C[ci];if(pat)S.remove(pat);pat=mk(PA[ci]);pat.position.set(7,0,.3);pat.rotation.y=-1.4;S.add(pat);
 mood=icon(PA[ci].mo);mood.position.set(0,2.75,0);mood.scale.set(.8,.8,1);mood.visible=false;pat.add(mood);
 cr=4;used={};wrong=0;lock=true;tx=1.3;state='in';$('bub').classList.add('hide');$('pan').classList.add('hide');$('res').innerHTML='';$('tip').textContent='';
 const[t,p,r]=c.v;$('vt').innerHTML=chip('🌡️ '+t+'°م',t>37.8)+chip('💓 '+p+'/د',p>100)+chip('🫁 '+r+'/د',r>22);
 $('tests').innerHTML=Object.keys(TS).map(k=>`<button class="tb" data-t="${k}"><span>${TS[k][0]}</span>${TS[k][1]}</button>`).join('');hud();}
function arrived(){const c=C[ci];pat.rotation.y=-1;mood.visible=true;say('🗣️ '+c.n+'، '+c.a+' سنة:','«'+c.m+'»<div class="chips">'+c.sy.map(s=>chip(s)).join('')+'</div>');$('pan').classList.remove('hide');lock=false;}
$('tests').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b||lock)return;const k=b.dataset.t;if(used[k])return;if(cr<=0){$('tip').textContent='انتهت تحاليلك، شخّص الآن!';return;}
 used[k]=1;cr--;lock=true;examT=T+1.5;tool.material.map=emoTex(TS[k][0]);tool.material.needsUpdate=true;say('👨‍⚕️ الطبيب:','جارٍ إجراء «'+TS[k][1]+'»… '+TS[k][0]);hud();
 setTimeout(()=>{lock=false;const rows=C[ci].r[k]||DEF[k];
  $('res').insertAdjacentHTML('afterbegin',`<div class="rc"><b>${TS[k][0]} ${TS[k][1]}</b>${rows.map(r=>`<div class="rr ${r[3]?'ab':''}"><span>${r[0]}</span><b>${r[1]} ${r[3]||''}</b><small>${r[2]}</small></div>`).join('')}</div>`);
  say('🗣️ '+C[ci].n+':','«'+C[ci].m+'»');},1500);});
$('dx').onclick=()=>{if(lock)return;const c=C[ci];$('pan').classList.add('hide');say('🗣️ '+c.n+':','«يا دكتور، ما الذي أصابني؟»');
 const ds=[c.dx,...C.filter((_,i)=>i!==ci).map(x=>x.dx).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 ds.forEach(d=>{const o=document.createElement('button');o.className='opt';o.textContent=d;o.onclick=()=>pick(o,d===c.dx);$('bo').appendChild(o);});
 const bk=document.createElement('button');bk.className='sm';bk.textContent='↩️ العودة للفحوصات';bk.onclick=()=>{$('bo').innerHTML='';say('🗣️ '+c.n+':','«'+c.m+'»');$('pan').classList.remove('hide');};$('bo').appendChild(bk);};
function pick(o,ok){const c=C[ci];
 if(!ok){o.classList.add('no');o.disabled=true;wrong++;hearts--;shake=T+.6;hud();if(hearts<=0){setTimeout(()=>finish(false),700);}return;}
 lock=true;joy=T+.9;let s=cr>=2?3:cr===1?2:1;s=Math.max(1,s-wrong);stars+=s;hud();say('🗣️ '+c.n+':','«شكرًا يا دكتور! أحسنت 😊»');
 setTimeout(()=>{$('rt').textContent='✅ تشخيص صحيح: '+c.dx;$('rst').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);$('rp').textContent=c.x;$('nx').textContent=ci>=C.length-1?'النتيجة النهائية':'المريض التالي';
  $('nx').onclick=()=>{$('rs').classList.add('hide');$('bub').classList.add('hide');mood.visible=false;pat.rotation.y=1.4;tx=7;state='out';};$('rs').classList.remove('hide');},900);}
function finish(w){lock=true;$('bub').classList.add('hide');$('pan').classList.add('hide');$('rt').textContent=w?'🏅 انتهى يومك في العيادة':'💔 فقدت ثقة المرضى';
 $('rst').textContent='⭐ '+stars+'/'+C.length*3;$('rp').textContent=(w?'':'راجع المعلومات وحاول مجددًا. ')+'التقييم: '+(stars>=13?'طبيب نابغ!':stars>=9?'طبيب ماهر':'طبيب متدرب');$('nx').textContent='ابدأ من جديد';$('nx').onclick=startGame;$('rs').classList.remove('hide');}
function startGame(){ci=0;hearts=3;stars=0;$('rs').classList.add('hide');$('start').classList.add('hide');nextCase();}
$('go').onclick=startGame;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 doc.a.position.y=Math.sin(T*2)*.02;const ex=T<examT;doc.armL.rotation.x+=((ex?-1.4:0)-doc.armL.rotation.x)*Math.min(1,dt*8);tool.visible=ex;if(ex)tool.position.y=1.7+Math.sin(T*8)*.08;
 if(pat){const dx=tx-pat.position.x;
  if(Math.abs(dx)>.03){pat.position.x+=Math.sign(dx)*Math.min(Math.abs(dx),3*dt);pat.a.position.y=Math.abs(Math.sin(T*10))*.07;pat.a.rotation.z=Math.sin(T*10)*.05;}
  else{pat.a.position.y=T<joy?Math.abs(Math.sin((joy-T)*8))*.3:Math.sin(T*2)*.02;pat.a.rotation.z=T<shake?Math.sin(T*40)*.1:Math.sin(T*1.5)*.02;
   if(state==='in'){state='talk';arrived();}else if(state==='out'){state='x';if(ci>=C.length-1)finish(true);else{ci++;nextCase();}}}
  if(mood.visible)mood.position.y=2.75+Math.sin(T*3)*.08;}
 R.render(S,cam);}
requestAnimationFrame(loop);
</script>
</body>
</html>
